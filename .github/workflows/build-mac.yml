name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target_arch: arm64
            zip_name: YouTubeCollector-macos-arm64.zip
          - name: macOS Intel
            runner: macos-15-intel
            target_arch: x86_64
            zip_name: YouTubeCollector-macos-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt
          python -m pip install pyinstaller

      - name: Build distributable zip
        run: |
          python packaging/build.py --onedir --clean --target-arch ${{ matrix.target_arch }} --package-zip --zip-name ${{ matrix.zip_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.zip_name }}
          archive: false
          if-no-files-found: error
          retention-days: 14
